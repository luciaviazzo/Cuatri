# Completar sonar.organization y sonar.projectKey con los valores de SonarCloud.
sonar.organization=REEMPLAZAR_ORG
sonar.projectKey=REEMPLAZAR_ORG_cuatri
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/.venv/**,backend/migrations/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
