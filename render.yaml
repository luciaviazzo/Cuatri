services:
  - type: web
    name: cuatri-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cuatri-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # completar con la URL de Vercel del frontend
      - key: ENVIRONMENT
        value: production

databases:
  - name: cuatri-db
    plan: free
    databaseName: cuatri
