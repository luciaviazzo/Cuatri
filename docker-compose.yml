services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-cuatri_dev}
      POSTGRES_USER: ${DB_USER:-cuatri}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cuatri_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cuatri}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
